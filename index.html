  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #f7f4ee;
    --card: #ffffff;
    --border: #d9d3c7;
    --text: #2c2a25;
    --muted: #7a756b;
    --accent: #8b5e3c;
    --accent-light: #f0e6d9;
    --input-bg: #fffdf8;
    --gutter: 10px;
    --handle-color: #c4bbad;
    --handle-hover: #8b5e3c;
  }

  html, body {
    height: 100%;
  }

  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 10px;
    user-select: none;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
    flex-shrink: 0;
  }

  header h1 {
    font-family: 'Anek Latin', sans-serif;
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--accent);
  }

  .header-controls {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .icon-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.3rem 0.5rem;
    cursor: pointer;
    color: var(--muted);
    font-size: 0.75rem;
    font-family: inherit;
    display: flex;
    align-items: center;
    gap: 0.3rem;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .icon-btn:hover { border-color: var(--accent); color: var(--accent); }
  .icon-btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* ── Theme toggle switch ── */
  .theme-toggle {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .theme-toggle svg {
    width: 13px;
    height: 13px;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
    flex-shrink: 0;
    transition: stroke 0.2s, opacity 0.2s;
  }
  .theme-toggle .sun-icon { stroke: var(--accent); opacity: 1; }
  .theme-toggle .moon-icon { stroke: var(--muted); opacity: 0.5; }
  body.dark .theme-toggle .sun-icon { stroke: var(--muted); opacity: 0.5; }
  body.dark .theme-toggle .moon-icon { stroke: var(--accent); opacity: 1; }

  .toggle-track {
    width: 32px;
    height: 18px;
    border-radius: 9px;
    background: var(--border);
    position: relative;
    transition: background 0.2s;
    flex-shrink: 0;
  }
  body.dark .toggle-track {
    background: var(--accent);
  }
  .toggle-thumb {
    position: absolute;
    top: 2px;
    left: 2px;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--card);
    box-shadow: 0 1px 2px rgba(0,0,0,0.15);
    transition: transform 0.2s;
  }
  body.dark .toggle-thumb {
    transform: translateX(14px);
  }

  .container {
    display: flex;
    flex-direction: column;
    gap: 10px;
    flex: 1;
    min-height: 0;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.85rem 1rem;
    position: relative;
    overflow: hidden;
    flex-shrink: 0;
  }

  .card-label {
    font-size: 0.7rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 8px;
    flex-shrink: 0;
  }

  .card-scroll {
    flex: 1;
    overflow-y: auto;
    min-height: 0;
  }

  .card-label .script-tag {
    font-size: 0.6rem;
    background: var(--accent-light);
    color: var(--accent);
    padding: 0.15rem 0.45rem;
    border-radius: 4px;
    font-weight: 500;
    letter-spacing: 0.04em;
  }

  textarea {
    width: 100%;
    min-height: 56px;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.85rem 1rem;
    font-family: 'Charis SIL', 'Gentium Plus', serif;
    font-size: 1.05rem;
    color: var(--text);
    background: var(--input-bg);
    resize: vertical;
    outline: none;
    transition: border-color 0.2s;
    line-height: 1.7;
    user-select: text;
  }

  textarea:focus { border-color: var(--accent); }
  textarea::placeholder { color: var(--border); }

  .output {
    font-size: 1.35rem;
    line-height: 2;
    min-height: 40px;
    word-break: break-word;
    white-space: pre-wrap;
    color: var(--text);
    user-select: text;
    cursor: text;
  }

  /* ── Selection highlight ── */
  ::selection { background: rgba(139,94,60,0.18); color: inherit; }
  body.dark ::selection { background: rgba(200,149,106,0.22); color: inherit; }

  .output.devanagari { font-family: 'Noto Serif Devanagari', serif; }
  .output.gujarati   { font-family: 'Noto Serif Gujarati', serif; }
  .output.telugu     { font-family: 'Noto Serif Telugu', serif; }
  .output.iast       { font-family: 'Charis SIL', 'Gentium Plus', serif; }

  .empty-state {
    color: var(--border);
    font-family: 'Inter', sans-serif;
    font-style: italic;
    font-size: 0.95rem;
    user-select: none;
  }

  .hint {
    margin-top: 0.6rem;
    font-size: 0.72rem;
    color: var(--muted);
    line-height: 1.5;
  }

  .hint code {
    background: var(--accent-light);
    padding: 0.1rem 0.3rem;
    border-radius: 3px;
    font-size: 0.7rem;
    font-family: 'SF Mono', 'Consolas', monospace;
  }

  .copy-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.3rem 0.55rem;
    font-size: 0.65rem;
    color: var(--muted);
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
    z-index: 2;
    flex-shrink: 0;
    white-space: nowrap;
  }
  .copy-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ── Resizable output grid ── */
  .output-grid {
    position: relative;
    width: 100%;
    flex: 1;
    min-height: 0;
    overflow: hidden;
  }

  .output-grid .card {
    position: absolute;
    overflow: hidden;
    min-width: 0;
    min-height: 0;
    border: none;
    outline: none;
    cursor: pointer;
  }
  .output-grid .card:focus {
    box-shadow: inset 0 0 0 1.5px var(--accent);
  }

  /* Gutter handles — wide invisible hit area, narrow visible pip */
  .handle {
    position: absolute;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .handle-v {
    width: 24px;
    margin-left: -7px;
    cursor: col-resize;
    top: 0;
    bottom: 0;
  }

  .handle-h {
    height: 24px;
    margin-top: -7px;
    cursor: row-resize;
    left: 0;
    right: 0;
  }

  .handle-pip {
    background: var(--handle-color);
    border-radius: 2px;
    transition: background 0.15s, transform 0.15s;
  }

  .handle-v .handle-pip {
    width: 3px;
    height: 24px;
  }

  .handle-h .handle-pip {
    height: 3px;
    width: 24px;
  }

  /* ── Dark mode ── */
  body.dark {
    --bg: #1a1917;
    --card: #26251f;
    --border: #3d3a32;
    --text: #e3dfd6;
    --muted: #9a9488;
    --accent: #c8956a;
    --accent-light: #362d23;
    --input-bg: #201f1a;
    --handle-color: #4a4639;
    --handle-hover: #c8956a;
  }

  /* ── Scheme overlay ── */
  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(0,0,0,0.45);
    justify-content: center;
    align-items: center;
    padding: 2rem;
  }
  .overlay.open { display: flex; }

  .overlay-panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.5rem 2rem;
    max-width: 640px;
    width: 100%;
    max-height: 80vh;
    overflow-y: auto;
    position: relative;
    color: var(--text);
  }

  .overlay-panel h2 {
    font-family: 'Anek Latin', sans-serif;
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--accent);
    margin-bottom: 1rem;
  }

  .overlay-close {
    position: absolute;
    top: 1rem;
    right: 1rem;
    background: none;
    border: none;
    cursor: pointer;
    color: var(--muted);
    font-size: 1.2rem;
    line-height: 1;
    padding: 0.2rem;
  }
  .overlay-close:hover { color: var(--accent); }

  .scheme-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.78rem;
  }
  .scheme-table th {
    text-align: left;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-size: 0.65rem;
    padding: 0.4rem 0.6rem;
    border-bottom: 1px solid var(--border);
  }
  .scheme-table td {
    padding: 0.35rem 0.6rem;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }
  .scheme-table td:first-child {
    font-family: 'SF Mono', 'Consolas', monospace;
    font-weight: 500;
    color: var(--accent);
  }
  .scheme-table tr:last-child td { border-bottom: none; }
  .scheme-table td:nth-child(2) { font-family: 'Charis SIL', 'Gentium Plus', serif; }
  .scheme-table td:nth-child(3) { font-family: 'Noto Serif Devanagari', serif; font-size: 1rem; }
  .scheme-section {
    font-weight: 600;
    color: var(--muted);
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding-top: 0.8rem;
  }

  .scheme-select {
    font-family: 'Anek Latin', sans-serif;
    font-size: 0.75rem;
    color: var(--text);
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 0.25rem 0.4rem;
    outline: none;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .scheme-select:focus { border-color: var(--accent); }

  .guide-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 2px;
    margin-bottom: 1rem;
    border-bottom: 1px solid var(--border);
    padding-bottom: 0;
  }
  .guide-tab {
    font-family: 'Anek Latin', sans-serif;
    font-size: 0.65rem;
    font-weight: 500;
    color: var(--muted);
    background: none;
    border: none;
    padding: 0.4rem 0.7rem;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    transition: all 0.15s;
  }
  .guide-tab:hover { color: var(--text); }
  .guide-tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
    font-weight: 600;
  }
  .guide-tab-content { display: none; }
  .guide-tab-content.active { display: block; }

  .handle:hover .handle-pip,
  .handle.active .handle-pip {
    background: var(--handle-hover);
    transform: scaleX(1.4) scaleY(1.4);
  }

  @media (max-width: 600px) {
    body { padding: 10px; }
    .output { font-size: 1.15rem; }
  }
</style>

<!-- Scheme overlay -->
<div class="overlay" id="scheme-overlay">
  <div class="overlay-panel">

    <h2 id="guide-title">Typing Guide</h2>

    <div id="scheme-table-container"></div>
  </div>
</div>

<div class="container">
  <div class="card" style="padding:10px">
    <div class="card-label" style="margin-bottom:8px">Input
      <select id="scheme-select" class="scheme-select">
        <option value="akshara">Akshara</option>
        <option value="hk">Harvard-Kyoto</option>
        <option value="iast">IAST</option>

      </select>
    </div>
    <textarea id="hk-input" placeholder="e.g. akSharaM ahaM puruShottama dAso'smi" spellcheck="false" style="margin-bottom:0;display:block"></textarea>
  </div>

  <div class="output-grid" id="output-grid">
    <!-- 4 cards positioned absolutely by JS -->
    <div class="card" id="cell-tl" tabindex="0">
      <div class="card-header">
        <div class="card-label">Devanāgarī <span class="script-tag">देवनागरी</span></div>

      </div>
      <div class="card-scroll"><div class="output devanagari" id="out-deva"><span class="empty-state">output appears here</span></div></div>
    </div>
    <div class="card" id="cell-tr" tabindex="0">
      <div class="card-header">
        <div class="card-label">Gujarātī <span class="script-tag">ગુજરાતી</span></div>
        <button class="copy-btn" onclick="copyOutput('out-gujr')">Copy</button>
      </div>

    </div>

      </div>
      <div class="card-scroll"><div class="output telugu" id="out-telu"><span class="empty-state">output appears here</span></div></div>
    </div>
    <div class="card" id="cell-br" tabindex="0">
      <div class="card-header">
        <div class="card-label">IAST <span class="script-tag">Romanized</span></div>

      </div>
      <div class="card-scroll"><div class="output iast" id="out-iast"><span class="empty-state">output appears here</span></div></div>
    </div>

    <!-- Draggable handles -->
    <div class="handle handle-v" id="handle-v"><div class="handle-pip"></div></div>
    <div class="handle handle-h" id="handle-h"><div class="handle-pip"></div></div>
  </div>

<script>
// ── Resizable Grid ──
const grid = document.getElementById('output-grid');
const cellTL = document.getElementById('cell-tl');
const cellTR = document.getElementById('cell-tr');
const cellBL = document.getElementById('cell-bl');
const cellBR = document.getElementById('cell-br');
const handleV = document.getElementById('handle-v');
const handleH = document.getElementById('handle-h');

const GAP = 10; // gutter size in px
let splitX = 0.5; // fraction 0–1
let splitY = 0.5;

function layoutGrid() {
  const W = grid.clientWidth;
  const H = grid.clientHeight;

  const colL = Math.round(splitX * (W - GAP));
  const colR = W - GAP - colL;
  const rowT = Math.round(splitY * (H - GAP));
  const rowB = H - GAP - rowT;

  const MAX_R = 10;

  function applyCell(el, x, y, w, h) {
    const cw = Math.max(0, w);
    const ch = Math.max(0, h);
    const smallest = Math.min(cw, ch);
    const r = Math.min(MAX_R, cw / 2, ch / 2);
    // Fade border and background below 60px
    const fadeStart = 60;
    const borderOpacity = Math.min(1, Math.max(0, smallest / fadeStart));
    const hidden = cw < 2 || ch < 2;
    el.style.cssText = [
      `left:${x}px`, `top:${y}px`,
      `width:${cw}px`, `height:${ch}px`,
      `border-radius:${r}px`,
      borderOpacity < 0.01 ? 'border:none' : `border:1px solid var(--border)`,
      `background:var(--card)`,
      `overflow:hidden`, `min-width:0`, `min-height:0`,
      `display:flex`, `flex-direction:column`,
      `padding:${Math.max(0, Math.min(10, smallest * 0.15))}px`,
      `opacity:${hidden ? 0 : borderOpacity}`,
      hidden ? 'pointer-events:none' : '',
    ].join(';');
  }

  applyCell(cellTL, 0, 0, colL, rowT);
  applyCell(cellTR, colL + GAP, 0, colR, rowT);
  applyCell(cellBL, 0, rowT + GAP, colL, rowB);
  applyCell(cellBR, colL + GAP, rowT + GAP, colR, rowB);

  handleV.style.left = `${colL}px`;
  handleH.style.top = `${rowT}px`;

  scaleCard(cellTL, colL, rowT);
  scaleCard(cellTR, colR, rowT);
  scaleCard(cellBL, colL, rowB);
  scaleCard(cellBR, colR, rowB);
}

function scaleCard(card, w, h) {
  const ref = Math.sqrt(Math.max(0, w) * Math.max(0, h));
  const scale = Math.max(0, Math.min(1.0, ref / 288));

  const header = card.querySelector('.card-header');
  const label = card.querySelector('.card-label');
  const tag = card.querySelector('.script-tag');
  const output = card.querySelector('.output');
  const btn = card.querySelector('.copy-btn');

  const smallest = Math.min(w, h);
  const fadeStart = 120;
  const fadeEnd = 30;
  const contentOpacity = Math.max(0, Math.min(1, (smallest - fadeEnd) / (fadeStart - fadeEnd)));

  if (header) {
    header.style.paddingBottom = Math.max(2, 8 * scale) + 'px';
    header.style.opacity = contentOpacity;
  }
  if (label) {
    label.style.fontSize = Math.max(6, 11 * scale) + 'px';
    label.style.whiteSpace = scale < 0.6 ? 'nowrap' : 'normal';
  }
  if (tag) {
    tag.style.fontSize = Math.max(5, 9.6 * scale) + 'px';
    tag.style.padding = `${Math.max(1, 2.4 * scale)}px ${Math.max(2, 7.2 * scale)}px`;
  }
  if (output) {
    output.style.fontSize = Math.max(8, 16 * scale) + 'px';
    output.style.lineHeight = String(Math.max(1.3, Math.min(2.0, 1.5 + scale * 0.5)));
    output.style.opacity = contentOpacity;
  }
  if (btn) {
    btn.style.fontSize = Math.max(6, 10.4 * scale) + 'px';
    btn.style.padding = `${Math.max(1, 4.8 * scale)}px ${Math.max(2, 8.8 * scale)}px`;
    btn.style.pointerEvents = contentOpacity < 0.1 ? 'none' : 'auto';
  }
}

layoutGrid();
new ResizeObserver(layoutGrid).observe(grid);

// Drag logic
let dragging = null;

function startDrag(which, e) {
  e.preventDefault();
  dragging = which;
  which.classList.add('active');
  document.body.style.cursor = which === handleV ? 'col-resize' : 'row-resize';
}

function onMove(e) {
  if (!dragging) return;
  const rect = grid.getBoundingClientRect();
  if (dragging === handleV) {
    splitX = Math.min(1.0, Math.max(0.0, (e.clientX - rect.left) / rect.width));
  } else {
    splitY = Math.min(1.0, Math.max(0.0, (e.clientY - rect.top) / rect.height));
  }
  layoutGrid();
}

function endDrag() {
  if (dragging) dragging.classList.remove('active');
  dragging = null;
  document.body.style.cursor = '';
}

handleV.addEventListener('mousedown', e => startDrag(handleV, e));
handleH.addEventListener('mousedown', e => startDrag(handleH, e));
document.addEventListener('mousemove', onMove);
document.addEventListener('mouseup', endDrag);

// Double-click to snap back to default
function animateTo(prop, target, duration = 300) {
  const start = prop === 'x' ? splitX : splitY;
  const t0 = performance.now();
  function tick(now) {
    const p = Math.min(1, (now - t0) / duration);
    const ease = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
    if (prop === 'x') splitX = start + (target - start) * ease;
    else splitY = start + (target - start) * ease;
    layoutGrid();
    if (p < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

handleV.addEventListener('dblclick', e => { e.preventDefault(); animateTo('x', 0.5); });
handleH.addEventListener('dblclick', e => { e.preventDefault(); animateTo('y', 0.5); });

// Touch support
handleV.addEventListener('touchstart', e => { startDrag(handleV, e); }, {passive:false});
handleH.addEventListener('touchstart', e => { startDrag(handleH, e); }, {passive:false});
document.addEventListener('touchmove', e => {
  if (!dragging) return;
  const t = e.touches[0];
  onMove(t);
}, {passive:false});
document.addEventListener('touchend', endDrag);

// ── Scheme Definitions ──

// Token format: [input, type, deva_codepoint, iast_string]
// Types: v=vowel, c=consonant, cn=consonant+nukta, s=special, nas=nasalization, sym=symbol, p=punctuation, cap=capitalize, d=digit

// ── Akshara (custom) ──

// ── Engine ──
const DEP_VOWEL_SIGN = {
  0x0905:null,0x0906:0x093E,0x0907:0x093F,0x0908:0x0940,0x0909:0x0941,0x090A:0x0942,
  0x090B:0x0943,0x0960:0x0944,0x090C:0x0962,0x0961:0x0963,0x090D:0x0945,
  0x090E:0x0946,0x090F:0x0947,0x0910:0x0948,0x0911:0x0949,0x0912:0x094A,0x0913:0x094B,0x0914:0x094C,
  0x0904:null,0x0972:null,0x0973:0x093A,0x0974:0x093B,0x0975:0x094F,
  0x0976:0x0956,0x0977:0x0957,0x0955:0x0955,0xA8FE:0xA8FF,
};
const VIRAMA=0x094D, NUKTA=0x093C, DEVA_DIGIT=0x0966;

let activeSchemeId = 'akshara';
let ALL_TOKENS = [];

function buildTokens(schemeId) {
  const s = SCHEMES[schemeId];
  const all = [...s.vowels, ...s.consonants, ...s.specials];
  all.sort((a,b) => b[0].length - a[0].length);
  return all;
}

function tokenize(src) {
  const scheme = SCHEMES[activeSchemeId];
  const tokens = [];
  let i = 0;
  while (i < src.length) {
    if (scheme.hasDigits && src[i]>='0' && src[i]<='9') {
      tokens.push([src[i],'d',parseInt(src[i]),src[i]]);
      i++; continue;
    }
    let matched = false;
    for (const tok of ALL_TOKENS) {
      if (src.substring(i,i+tok[0].length) === tok[0]) {
        tokens.push(tok); i+=tok[0].length; matched=true; break;
      }
    }
    if (!matched) { tokens.push([src[i],'o',src.charCodeAt(i),src[i]]); i++; }
  }
  return tokens;
}

// Known-invalid dep vowel sign offsets (sign+offset produces unassigned codepoint)
const INVALID_DEP_SIGNS = new Set([
  // Telugu: candra E/O signs don't exist
  0x0945+0x0300, 0x0949+0x0300,
  // Gujarati: short E/O signs don't exist
  0x0946+0x0180, 0x094A+0x0180,
  // Gujarati: Kashmiri signs don't exist
  0x093A+0x0180, 0x093B+0x0180, 0x094F+0x0180, 0x0956+0x0180, 0x0957+0x0180,
  // Telugu: Kashmiri/extended signs don't exist
  0x093A+0x0300, 0x093B+0x0300, 0x094E+0x0300, 0x094F+0x0300,
  0x0955+0x0300, 0x0956+0x0300, 0x0957+0x0300,
]);

function renderIndic(tokens, offset) {
  let out='';
  for (let i=0;i<tokens.length;i++) {
    const [,type,cp,,devaOnly]=tokens[i];
    const off = devaOnly ? 0 : offset;
    if (type==='c'||type==='cn'||type==='cdx') {
      out+=String.fromCodePoint(cp + (type==='cdx'?0:off));
      if (type==='cn') out+=String.fromCodePoint(NUKTA+off);
      if (i+1<tokens.length&&tokens[i+1][1]==='v') {
        const vcp=tokens[i+1][2];
        const vOff=tokens[i+1][4]?0:off;
        const sign=DEP_VOWEL_SIGN[vcp];
        if (sign!==null&&sign!==undefined) {
          const sOff=tokens[i+1][4]?0:off;
          out+=String.fromCodePoint(INVALID_DEP_SIGNS.has(sign+sOff)?sign:sign+sOff);
        }
        i++;
      } else { out+=String.fromCodePoint(VIRAMA+off); }
    } else if (type==='v') { out+=String.fromCodePoint(cp+off); }
    else if (type==='nas') { out+=String.fromCodePoint(cp+off); }
    else if (type==='s') { out+=String.fromCodePoint(cp+(devaOnly?0:offset)); }
    else if (type==='sym') { out+=String.fromCodePoint(cp+(devaOnly?0:offset)); }
    else if (type==='dx') { out+=String.fromCodePoint(cp); }
    else if (type==='gx') {
      if(offset===0x0180) out+=String.fromCodePoint(cp);
      else if(offset===0x0300) out+=(tokens[i][5]||tokens[i][4]);
      else out+=(tokens[i][4]||String.fromCodePoint(cp));
    }
    else if (type==='d') { out+=String.fromCodePoint(DEVA_DIGIT+offset+cp); }
    else if (type==='p') { if(cp>0){const pOff=(cp===0x0964||cp===0x0965)?0:(devaOnly?0:offset);out+=String.fromCodePoint(cp+pOff);}else out+=tokens[i][3]; }
    else if (type==='cap') {}
    else { out+=String.fromCodePoint(cp); }
  }
  return out;
}

function renderIAST(tokens) {
  let out='',cap=false;
  for (let i=0;i<tokens.length;i++) {
    const [,type,cp,iast]=tokens[i];
    if (type==='cap'){cap=true;continue;}
    if (type==='nas'){out+='\u0303';continue;}
    if (type==='d'){out+=iast;continue;}
    let s=iast;
    if (cap&&s.length>0){s=s[0].toUpperCase()+s.slice(1);cap=false;}
    out+=s;
  }
  return out;
}

const OFFSET={deva:0,gujr:0x0180,telu:0x0300};

const input=document.getElementById('hk-input');
const schemeSelect=document.getElementById('scheme-select');
const outDeva=document.getElementById('out-deva');
const outGujr=document.getElementById('out-gujr');
const outTelu=document.getElementById('out-telu');
const outIast=document.getElementById('out-iast');
const empty='<span class="empty-state">output appears here</span>';

function update() {
  const src=input.value;
  if (!src.trim()){outDeva.innerHTML=outGujr.innerHTML=outTelu.innerHTML=outIast.innerHTML=empty;return;}
  const tokens=tokenize(src);
  outDeva.textContent=renderIndic(tokens,OFFSET.deva);
  outGujr.textContent=renderIndic(tokens,OFFSET.gujr);
  outTelu.textContent=renderIndic(tokens,OFFSET.telu);
  outIast.textContent=renderIAST(tokens);
}

function switchScheme(id) {
  activeSchemeId=id;
  ALL_TOKENS=buildTokens(id);
  updateGuide();
  update();
}

schemeSelect.addEventListener('change',()=>switchScheme(schemeSelect.value));
input.addEventListener('input',update);

// Tab inserts a tab character instead of moving focus
input.addEventListener('keydown',e=>{
  if(e.key==='Tab'){
    e.preventDefault();
    const start=input.selectionStart, end=input.selectionEnd;
    input.value=input.value.substring(0,start)+'\t'+input.value.substring(end);
    input.selectionStart=input.selectionEnd=start+1;
    update();
  }
});

  [0x1CD0,0x1CE8],[0x1CED,0x1CED],[0x1CF4,0x1CF4],[0x1CF7,0x1CF9],
  [0x0AFA,0x0AFF]];
function isCombining(cp) { return COMBINING_RANGES.some(([lo,hi])=>cp>=lo&&cp<=hi); }

function makeTable(rows) {
  let h='<table class="scheme-table"><tr><th>Input</th><th>IAST</th><th>Devanāgarī</th></tr>';
  for (const r of rows) {
    if (typeof r === 'string') { h+=`<tr><td colspan="3" class="scheme-section">${r}</td></tr>`; continue; }
    const inp=r[0].replace(/</g,'&lt;').replace(/>/g,'&gt;');
    let iast=r[3]||'';
    if(r[1]==='nas') iast='◌̃ (tilde)';
    let deva='';
    try {
      if(r[1]==='dx') deva=(isCombining(r[2])?'◌':'')+String.fromCodePoint(r[2]);
      else if(r[1]==='v'||r[1]==='sym') deva=String.fromCodePoint(r[2]);
      else if(r[1]==='c') deva=String.fromCodePoint(r[2]);
      else if(r[1]==='cn') deva=String.fromCodePoint(r[2])+String.fromCodePoint(0x093C);
      else if(r[1]==='s'||r[1]==='nas') deva=(isCombining(r[2])?'◌':'')+String.fromCodePoint(r[2]);
      else if(r[1]==='p'&&r[2]>0) deva=String.fromCodePoint(r[2]);
      else if(r[1]==='p') deva=r[3];
      else if(r[1]==='gx') deva='◌'+String.fromCodePoint(r[2])+' (ગુજ)  ◌'+(r[4]||'')+ ' (fallback)';
      else if(r[1]==='cap') { iast='#→Capitalize'; deva='—'; }
    } catch(e) { deva='?'; }
    h+=`<tr><td>${inp}</td><td>${iast}</td><td>${deva}</td></tr>`;
  }
  h+='</table>';
  return h;
}

function dedup(arr) {
  const seen=new Set(); return arr.filter(t=>{if(typeof t==='string')return true;const k=t[2]+'-'+t[1];if(seen.has(k))return false;seen.add(k);return true;});
}

function updateGuide() {
  const s=SCHEMES[activeSchemeId];
  document.getElementById('guide-title').textContent=s.name+' Typing Guide';
  document.getElementById('guide-desc').textContent=s.desc;
  const container=document.getElementById('scheme-table-container');

  if (activeSchemeId==='akshara') {
    // Tabbed guide for Akshara
    const coreV=s.vowels.filter(t=>!t[4]&&t[1]!=='sym');
    const coreSym=s.vowels.filter(t=>!t[4]&&t[1]==='sym');
    const coreC=s.consonants.filter(t=>!t[4]&&t[1]!=='cn');
    const coreNukta=s.consonants.filter(t=>!t[4]&&t[1]==='cn');
    const coreS=s.specials.filter(t=>{return !t[4]&&t[1]!=="dx"&&!t[0].startsWith("{")&&!t[0].startsWith("(MM")&&t[0]!=="(&)"&&t[0]!=="(..)"&&t[0]!=="(?)"&&t[0]!=="(/)" && t[0]!=="(\\\\)"&&t[0]!=="(`)"&&t[0]!=="(~)";});

    const coreRows=dedup(['Vowels',...coreV,...coreSym,'Gutturals',
      ...coreC.filter(t=>[0x0915,0x0916,0x0917,0x0918,0x0919].includes(t[2])),
      'Palatals',...coreC.filter(t=>[0x091A,0x091B,0x091C,0x091D,0x091E].includes(t[2])),
      'Retroflexes',...coreC.filter(t=>[0x091F,0x0920,0x0921,0x0922,0x0923].includes(t[2])),
      'Dentals',...coreC.filter(t=>[0x0924,0x0925,0x0926,0x0927,0x0928].includes(t[2])),
      'Labials',...coreC.filter(t=>[0x092A,0x092B,0x092C,0x092D,0x092E].includes(t[2])),
      'Semivowels & Sibilants',...coreC.filter(t=>[0x092F,0x0930,0x0932,0x0933,0x0935,0x0936,0x0937,0x0938,0x0939].includes(t[2])),
      'Nukta (Perso-Arabic)',...coreNukta,
      'Marks & Punctuation',...coreS]);

    const extV=s.vowels.filter(t=>t[4]);
    const extC=s.consonants.filter(t=>t[4]);
    const gujMarks=s.specials.filter(t=>t[1]==='gx');
    const extRows=dedup(['Extended Vowels (Dravidian, Kashmiri, Marathi)',...extV,
      'Additional Consonants (Nukta)',...extC.filter(t=>t[1]==='cn'),
      'Sindhi Implosives',...extC.filter(t=>t[1]==='c'&&[0x097B,0x097C,0x097E,0x097F].includes(t[2])),
      'Marwari',...extC.filter(t=>[0x0978,0x097A].includes(t[2])),
      'Gujarati-Specific (Perso-Arabic)',...gujMarks]);

    // ── Per-Veda tab organization ──
    const vedicAccents=s.specials.filter(t=>{return t[0]==='(/)' || t[0]==='(\\)' || t[0]==='(`)' || t[0]==='(~)';});
    const extMark=s.specials.filter(t=>t[0].startsWith('(MM')&&t[4]);
    const extPunct=s.specials.filter(t=>['(&)','(..)','(?)'].includes(t[0]));
    const veVisarga=s.specials.filter(t=>/^\{h[SUAR]/.test(t[0]));
    const veAnusvara=s.specials.filter(t=>/^\{M[abvtl6ru2]/.test(t[0]));
    const veArdha=s.specials.filter(t=>t[0]==='{ah}'||t[0]==='{ahr}');

    // Vedic (Shared) tab
    const sharedRows=dedup([
      'Vedic Accents',...vedicAccents,
      'Inverted Candrabindu',...s.specials.filter(t=>t[0]==='MMMM'),
      'Extended Candrabindu Variants',...extMark,
      'General Tones',
      ...s.specials.filter(t=>['{v2}','{v3}','{vAn}','{v.}'].includes(t[0])),
      'Visarga Diacritics',...veVisarga,
      'Anusvāra Variants',...veAnusvara,
      'Ardhavisarga',...veArdha,
      'Jihvāmūlīya & Upadhmānīya',
      ...s.specials.filter(t=>['{jm}','{up}'].includes(t[0])),
      'Additional Punctuation',...extPunct]);

    // Sāmaveda tab
    const sama=s.specials.filter(t=>t[0].startsWith('{s'));
    const samaRows=dedup([
      'Combining Digits (Svara Notation)',...sama.filter(t=>/\{s\d\}/.test(t[0])),
      'Combining Letters',...sama.filter(t=>!/\{s\d\}/.test(t[0])),
      'Tone Marks',...s.specials.filter(t=>['{vK}','{vS}','{vP}'].includes(t[0])),
      'Breathing Mark',...s.specials.filter(t=>t[0]==='{nih}'),
      'Jaiminiya Sāmaveda',...s.specials.filter(t=>['{jr}','{jr2}'].includes(t[0])),
      'Atikrama (Svara Skip)',...s.specials.filter(t=>t[0]==='{at}')]);

    // Yajurveda tab
    const yajurRows=dedup([
      'Svarita Marks',
      ...s.specials.filter(t=>/^\{y[MAIKC]/.test(t[0])||t[0]==='{yKs}'),
      'Candra Above',...s.specials.filter(t=>t[0]==='{yCa}'),
      'Śatapatha Brāhmaṇa (Dots Below)',
      ...s.specials.filter(t=>['{v..}','{v...}'].includes(t[0]))]);

    // Ṛgveda & Atharvaveda tab
    const rgAtharvaRows=dedup([
      'Ṛgvedic',...s.specials.filter(t=>t[0]==='{rK}'),
      'Atharvavedic',...s.specials.filter(t=>t[0]==='{aS}')]);

    // Manuscript tab
    const bhale=s.specials.filter(t=>t[0].startsWith('{hm')||t[0].startsWith('{bh')||t[0]==='{md}');
    const msPunct=s.specials.filter(t=>['(siddham)','(*)','(_)','(^)','(=)'].includes(t[0]));
    const msRows=dedup(['Auspicious Signs (Bhale Mīṇḍu)',...bhale,'Manuscript Punctuation',...msPunct]);

    const tabs=[
      {id:'core',label:'Core',html:makeTable(coreRows)},
      {id:'ext',label:'Extended',html:makeTable(extRows)},
      {id:'vedic',label:'Vedic',html:makeTable(sharedRows)},
      {id:'sama',label:'Sāmaveda',html:makeTable(samaRows)},
      {id:'yajur',label:'Yajurveda',html:makeTable(yajurRows)},
      {id:'rgatharva',label:'Ṛg & Atharva',html:makeTable(rgAtharvaRows)},
      {id:'ms',label:'Manuscript',html:makeTable(msRows)},
    ];

    let html='<div class="guide-tabs">';
    tabs.forEach((t,i)=>{ html+=`<button class="guide-tab${i===0?' active':''}" data-tab="${t.id}">${t.label}</button>`; });
    html+='</div>';
    tabs.forEach((t,i)=>{ html+=`<div class="guide-tab-content${i===0?' active':''}" id="tab-${t.id}">${t.html}</div>`; });
    container.innerHTML=html;

    container.querySelectorAll('.guide-tab').forEach(btn=>{
      btn.addEventListener('click',()=>{
        container.querySelectorAll('.guide-tab').forEach(b=>b.classList.remove('active'));
        container.querySelectorAll('.guide-tab-content').forEach(c=>c.classList.remove('active'));
        btn.classList.add('active');
        container.querySelector('#tab-'+btn.dataset.tab).classList.add('active');
      });
    });
  } else {
    // Flat table for other schemes
    const seen=new Set();
    const vowels=s.vowels.filter(t=>{if(seen.has(t[2]))return false;seen.add(t[2]);return true;});
    const cSeen=new Set();
    const cons=s.consonants.filter(t=>{const k=t[2]+(t[1]==='cn'?9999:0);if(cSeen.has(k))return false;cSeen.add(k);return true;});
    const classMap=[['Gutturals',[0x0915,0x0916,0x0917,0x0918,0x0919]],['Palatals',[0x091A,0x091B,0x091C,0x091D,0x091E]],
      ['Retroflexes',[0x091F,0x0920,0x0921,0x0922,0x0923]],['Dentals',[0x0924,0x0925,0x0926,0x0927,0x0928]],
      ['Labials',[0x092A,0x092B,0x092C,0x092D,0x092E]],['Semivowels & Sibilants',[0x092F,0x0930,0x0932,0x0933,0x0935,0x0936,0x0937,0x0938,0x0939]]];
    const rows=['Vowels',...vowels];
    for(const [title,cps] of classMap){const r=cons.filter(t=>cps.includes(t[2]));if(r.length)rows.push(title,...r);}
    const nukta=cons.filter(t=>t[1]==='cn');if(nukta.length)rows.push('Nukta',...nukta);
    const specRows=s.specials.filter(t=>t[1]==='s'||t[1]==='nas'||t[1]==='sym');
    const sDedup=[];const sSeen=new Set();for(const t of specRows){if(!sSeen.has(t[0])){sSeen.add(t[0]);sDedup.push(t);}}
    if(sDedup.length)rows.push('Marks',...sDedup);
    const punct=s.specials.filter(t=>t[1]==='p');if(punct.length)rows.push('Punctuation',...punct);
    container.innerHTML=makeTable(dedup(rows));
  }
}

function copyOutput(id) {
  const el=document.getElementById(id);
  const text=el.textContent;
  if(!text||el.querySelector('.empty-state'))return;
  const ta=document.createElement('textarea');
  ta.value=text;ta.style.position='fixed';ta.style.left='-9999px';
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');}catch(e){}
  document.body.removeChild(ta);
  const btn=el.parentElement.parentElement.querySelector('.copy-btn');
  if(btn){btn.textContent='Copied';setTimeout(()=>btn.textContent='Copy',1200);}
}

// Init
ALL_TOKENS=buildTokens('akshara');
input.value='svAminArAyaNaH sAkShAt akSharapuruShottama';
updateGuide();
update();

// ── Select all in focused output card ──
document.querySelectorAll('.output-grid .card').forEach(card=>{
  card.addEventListener('keydown',e=>{
    if((e.ctrlKey||e.metaKey)&&e.key==='a'){
      e.preventDefault();
      const el=card.querySelector('.output');if(!el)return;
      const range=document.createRange();range.selectNodeContents(el);
      const sel=window.getSelection();sel.removeAllRanges();sel.addRange(range);
    }
  });
});

// ── Dark mode toggle ──
document.getElementById('theme-toggle').addEventListener('click',()=>{
  document.body.classList.toggle('dark');layoutGrid();
});

// ── Scheme overlay ──
const schemeOverlay=document.getElementById('scheme-overlay');
document.getElementById('scheme-btn').addEventListener('click',()=>schemeOverlay.classList.add('open'));
document.getElementById('scheme-close').addEventListener('click',()=>schemeOverlay.classList.remove('open'));
schemeOverlay.addEventListener('click',e=>{if(e.target===schemeOverlay)schemeOverlay.classList.remove('open');});
</script>
